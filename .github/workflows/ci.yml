name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the browser bundle
        run: npm run build

      - name: Unit tests
        run: npm test

      # lib/ is committed so the theme can be installed straight from the
      # repository. Fail when a source change was not rebuilt and committed.
      - name: Check the committed bundle matches the sources
        run: git diff --exit-code -- lib
