name: Release

# Pushing a v* tag publishes the theme: build, verify, pack and open a GitHub
# Release with the installable tarball attached. Nothing else is required.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tag is the release version, so a mismatch would publish an artifact
      # whose manifest contradicts its own release.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Build the browser bundle
        run: npm run build

      - name: Check the committed bundle matches the sources
        run: git diff --exit-code -- lib

      - name: Unit tests
        run: npm test

      - name: Pack the installable theme
        run: npm run pack:theme

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > "$RUNNER_TEMP/generated.md" \
            || : > "$RUNNER_TEMP/generated.md"
          cat .github/release-header.md "$RUNNER_TEMP/generated.md" > "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "深空指挥舰桥 $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            ./*.tgz
